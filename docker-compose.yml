services:
  subspacead-gpu:
    profiles: ["gpu"]
    container_name: subspacead-gpu
    build:
      context: .
      dockerfile: deploy/Dockerfile.gpu
    image: subspacead:gpu
    ports:
      - "8704:8704"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - MODELSCOPE_TOKEN=${MODELSCOPE_TOKEN}
    restart: unless-stopped

  subspacead-cpu:
    profiles: ["cpu"]
    container_name: subspacead-cpu
    build:
      context: .
      dockerfile: deploy/Dockerfile.cpu
    image: subspacead:cpu
    ports:
      - "8704:8704"
    environment:
      - MODELSCOPE_TOKEN=${MODELSCOPE_TOKEN}
    restart: unless-stopped
