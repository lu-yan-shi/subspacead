<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · SubspaceAD 深瞳</title>
<style>
/* ---- 主题变量（与 index.html 一致）---- */
:root {
  --bg: #f4f6f8; --bg2: #ffffff; --surface: #ffffff; --surface2: #eef1f4; --surface3: #e2e7ec;
  --border: #d8dde3; --border2: #c4cbd3; --text: #1f2429; --text2: #5b6570; --text3: #8a949e;
  --cyan: #0a86a8; --cyan2: #0a7a9a; --cyan-dim: rgba(10,134,168,.08); --cyan-glow: rgba(10,134,168,.18);
  --mono: "JetBrains Mono", "SF Mono", "Consolas", monospace;
}
html[data-bg="light"] {}
html[data-bg="midnight"],
html[data-bg="warm-gray"],
html[data-bg="dark-green"] {
  --surface: #202327; --surface2: #272a2e; --surface3: #2f3237;
  --border: #36393f; --border2: #44474d; --text: #d2d4d8; --text2: #93969b; --text3: #5c5f64;
  --cyan: #00a8cc; --cyan2: #0088a8; --cyan-dim: rgba(0,168,204,0.10); --cyan-glow: rgba(0,168,204,0.20);
}
html[data-bg="midnight"]   { --bg: #0a1628; --bg2: #101d34; }
html[data-bg="warm-gray"]  { --bg: #1c1a17; --bg2: #25231f; }
html[data-bg="dark-green"] { --bg: #0d1a0d; --bg2: #152415; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  overflow: hidden;
}

/* ================= 背景层（科技感） ================= */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg > div { position: absolute; }

/* 1. 底色渐变 + 角落辉光 */
.bg-base {
  inset: 0;
  background:
    radial-gradient(1100px 700px at 88% -12%, var(--cyan-glow), transparent 58%),
    radial-gradient(900px 620px at -8% 108%, var(--cyan-dim), transparent 60%),
    linear-gradient(155deg, var(--bg) 0%, var(--bg2) 52%, var(--bg) 100%);
}

/* 2. 科技网格（径向淡出） */
.bg-grid {
  inset: 0;
  background-image:
    linear-gradient(rgba(120,140,160,.13) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,140,160,.13) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 42%, #000 10%, transparent 74%);
  mask-image: radial-gradient(ellipse at 50% 42%, #000 10%, transparent 74%);
}

/* 3. 光斑（模糊渐变圆，缓慢漂移） */
.bg-blob { border-radius: 50%; filter: blur(70px); will-change: transform; }
.bg-blob-1 { width: 560px; height: 560px; top: -14%; left: -10%; background: var(--cyan-dim); opacity: .9; animation: drift1 24s ease-in-out infinite alternate; }
.bg-blob-2 { width: 500px; height: 500px; bottom: -18%; right: -12%; background: var(--cyan-glow); opacity: .45; animation: drift2 30s ease-in-out infinite alternate; }
.bg-blob-3 { width: 340px; height: 340px; top: 52%; left: 52%; background: var(--cyan-dim); opacity: .7; animation: drift3 27s ease-in-out infinite alternate; }

/* 4. 粒子星点（两层 box-shadow 星场） */
.bg-particles { border-radius: 50%; will-change: transform; }
.bg-particles-1 {
  width: 3px; height: 3px; background: rgba(120,140,160,.6);
  box-shadow:
    140px 90px 0 rgba(0,168,204,.6),   320px 210px 0 rgba(120,140,160,.5),
    500px 150px 0 rgba(0,168,204,.5),   680px 260px 0 rgba(120,140,160,.45),
    860px 120px 0 rgba(0,168,204,.55),  1040px 220px 0 rgba(120,140,160,.5),
    1210px 170px 0 rgba(0,168,204,.5),  1380px 300px 0 rgba(120,140,160,.45),
    240px 400px 0 rgba(0,168,204,.4),   460px 340px 0 rgba(120,140,160,.4),
    760px 400px 0 rgba(0,168,204,.4),   1000px 360px 0 rgba(120,140,160,.4),
    1200px 440px 0 rgba(0,168,204,.4),  90px 640px 0 rgba(120,140,160,.4);
  opacity: .55; animation: drift1 38s ease-in-out infinite alternate, twinkle 5s ease-in-out infinite alternate;
}
.bg-particles-2 {
  width: 2px; height: 2px; background: rgba(0,168,204,.5);
  box-shadow:
    60px 760px 0 rgba(0,168,204,.5),   250px 860px 0 rgba(120,140,160,.4),
    520px 780px 0 rgba(0,168,204,.45), 820px 900px 0 rgba(120,140,160,.4),
    1120px 820px 0 rgba(0,168,204,.5), 1380px 640px 0 rgba(120,140,160,.4),
    320px 600px 0 rgba(0,168,204,.35), 940px 560px 0 rgba(120,140,160,.35),
    80px 430px 0 rgba(0,168,204,.35),  1320px 480px 0 rgba(120,140,160,.35);
  opacity: .5; animation: drift2 46s ease-in-out infinite alternate, twinkle 7s ease-in-out infinite alternate-reverse;
}

/* 5. 雷达环 + 扫描臂 */
.bg-radar {
  left: 50%; top: 50%; width: 780px; height: 780px;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 1px solid var(--border); opacity: .5;
}
.bg-radar::before {
  content: ""; position: absolute; inset: 16%;
  border-radius: 50%; border: 1px dashed var(--border2); opacity: .6;
}
.bg-radar::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--cyan-glow), transparent 24%);
  animation: spin 9s linear infinite;
}
.bg-radar .ring-x, .bg-radar .ring-y { position: absolute; background: var(--border); opacity: .35; }
.bg-radar .ring-x { left: 50%; top: 0; bottom: 0; width: 1px; }
.bg-radar .ring-y { top: 50%; left: 0; right: 0; height: 1px; }

/* 6. 竖向扫描光线 */
.bg-scan {
  left: 0; right: 0; top: -30%; height: 170px;
  background: linear-gradient(180deg, transparent, var(--cyan-dim), transparent);
  opacity: .55; will-change: transform;
  animation: scanSweep 11s ease-in-out infinite;
}

/* 7. 底部辉光地平线 */
.bg-horizon { left: 0; right: 0; bottom: 0; height: 240px; opacity: .6;
  background: linear-gradient(180deg, transparent, var(--cyan-glow)); }

/* 8. 暗角：聚焦中央 */
.bg-vignette { inset: 0; opacity: .9;
  background: radial-gradient(ellipse at 50% 45%, transparent 24%, var(--bg) 116%); }

/* ---- 动画关键帧 ---- */
@keyframes drift1 { from { transform: translate(0,0) scale(1); }    to { transform: translate(70px,46px) scale(1.14); } }
@keyframes drift2 { from { transform: translate(0,0) scale(1.06); } to { transform: translate(-60px,-34px) scale(1); } }
@keyframes drift3 { from { transform: translate(0,0) scale(.95); }  to { transform: translate(36px,-46px) scale(1.1); } }
@keyframes twinkle { from { opacity: .25; } to { opacity: .7; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes scanSweep { 0%,100% { transform: translateY(0); } 50% { transform: translateY(150vh); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  .bg-blob, .bg-particles, .bg-radar::after, .bg-scan, .dot { animation: none; }
}

/* ================= 边缘装饰（四角 + 顶底细线 + 状态标注） ================= */
.edge { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
/* 顶/底细线 */
.edge-line { position: absolute; left: 56px; right: 56px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent); opacity: .5; }
.edge-line-t { top: 15px; }
.edge-line-b { bottom: 15px; }
/* 四角科技角框 */
.edge-corner { position: absolute; width: 30px; height: 30px; border: 2px solid var(--cyan); opacity: .45; }
.ec-tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
.ec-tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
.ec-bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
.ec-br { bottom: 16px; right: 16px; border-left: none; border-top: none; }
/* 四角状态文字（mono） */
.edge-tag { position: absolute; font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; color: var(--text3); text-transform: uppercase; }
.et-tl { top: 26px; left: 56px; }
.et-tr { top: 26px; right: 56px; }
.et-bl { bottom: 26px; left: 56px; }
.et-br { bottom: 26px; right: 56px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3fb950; margin-right: 6px; box-shadow: 0 0 8px rgba(63,185,80,.8); animation: pulse 2s ease-in-out infinite; }

/* ================= 登录卡片（居中，玻璃 + 渐变描边 + 角框） ================= */
.login-wrap { position: relative; z-index: 1; width: 100%; max-width: 402px; padding: 0 20px; }
.login-card {
  position: relative;
  border: 1px solid transparent;
  background:
    linear-gradient(color-mix(in srgb, var(--bg2) 88%, transparent),
                    color-mix(in srgb, var(--bg2) 88%, transparent)) padding-box,
    linear-gradient(135deg, var(--border), var(--cyan-glow), var(--border)) border-box;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-radius: 16px; padding: 36px 38px 28px;
  box-shadow: 0 24px 70px rgba(0,0,0,.20);
}
/* 卡片四角科技角框 */
.login-card::before, .login-card::after {
  content: ""; position: absolute; width: 20px; height: 20px;
  border: 2px solid var(--cyan); opacity: .5;
}
.login-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 16px; }
.login-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 16px; }

.brand {
  font-size: 32px; font-weight: 800; letter-spacing: 4px; text-align: center;
  background: linear-gradient(120deg, var(--cyan), var(--cyan2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--cyan);
  filter: drop-shadow(0 2px 12px var(--cyan-glow));
}
.sub { text-align: center; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.8px; margin: 10px 0 28px; }
.fg { margin-bottom: 16px; }
.fg label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: .3px; }
.fg input {
  width: 100%; padding: 11px 12px; font-size: 14px; font-family: var(--mono);
  background: var(--surface3);
  background: color-mix(in srgb, var(--surface3) 82%, transparent);
  color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.fg input::placeholder { color: var(--text3); opacity: .7; }
.fg input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-dim); }
.remember-row { display: flex; align-items: center; gap: 18px; margin: 2px 0 14px; user-select: none; }
.rem-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); cursor: pointer; letter-spacing: .3px; }
.rem-item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--cyan); cursor: pointer; margin: 0; }
.err { min-height: 20px; font-size: 12px; color: #e5534b; margin: 2px 0 10px; }
.btn-login {
  width: 100%; padding: 13px 0; font-size: 15px; font-weight: 600; letter-spacing: 6px;
  color: #fff; background: linear-gradient(120deg, var(--cyan), var(--cyan2));
  border: none; border-radius: 8px; cursor: pointer;
  box-shadow: 0 6px 18px var(--cyan-glow);
  transition: filter .15s, transform .05s, box-shadow .15s;
}
.btn-login:hover { filter: brightness(1.08); box-shadow: 0 8px 24px var(--cyan-glow); }
.btn-login:active { transform: translateY(1px); }
.btn-login[disabled] { opacity: .65; cursor: default; filter: none; }
.foot { margin-top: 24px; text-align: center; font-size: 11px; color: var(--text3); letter-spacing: .4px; }
</style>
</head>
<body>
<div class="bg">
  <div class="bg-base"></div>
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <div class="bg-particles bg-particles-1"></div>
  <div class="bg-particles bg-particles-2"></div>
  <div class="bg-radar">
    <div class="ring-x"></div><div class="ring-y"></div>
  </div>
  <div class="bg-scan"></div>
  <div class="bg-horizon"></div>
  <div class="bg-vignette"></div>
</div>

<div class="edge">
  <div class="edge-line edge-line-t"></div>
  <div class="edge-line edge-line-b"></div>
  <div class="edge-corner ec-tl"></div>
  <div class="edge-corner ec-tr"></div>
  <div class="edge-corner ec-bl"></div>
  <div class="edge-corner ec-br"></div>
  <div class="edge-tag et-tl">SubspaceAD · DINOv2</div>
  <div class="edge-tag et-tr">安全登录</div>
  <div class="edge-tag et-bl">© 2026 深瞳</div>
  <div class="edge-tag et-br"><span class="dot"></span>服务在线</div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="brand">深瞳</div>
    <div class="sub">SubspaceAD · 工业异常检测</div>
    <div class="fg"><label>用户名</label><input id="user" type="text" autocomplete="username" placeholder="请输入用户名" spellcheck="false"></div>
    <div class="fg"><label>密码</label><input id="pass" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
    <div class="remember-row">
      <label class="rem-item"><input type="checkbox" id="remUser"><span>记住账号</span></label>
      <label class="rem-item"><input type="checkbox" id="remPass"><span>记住密码</span></label>
    </div>
    <div class="err" id="err"></div>
    <button class="btn-login" id="loginBtn">登 录</button>
    <div class="foot">SubspaceAD · 少样本异常检测服务</div>
  </div>
</div>
<script>
(function () {
  var TOKEN_KEY = 'subspacead-token';
  var REM_USER = 'subspacead-rem-user';
  var REM_PASS = 'subspacead-rem-pass';
  var err = document.getElementById('err');
  var user = document.getElementById('user');
  var pass = document.getElementById('pass');
  var btn = document.getElementById('loginBtn');
  var remUser = document.getElementById('remUser');
  var remPass = document.getElementById('remPass');
  // 记住密码需连带记住账号（密码无账号无法回填）；取消记住账号则一并取消记住密码
  remPass.addEventListener('change', function () { if (remPass.checked) remUser.checked = true; });
  remUser.addEventListener('change', function () { if (!remUser.checked) remPass.checked = false; });

  // 记住密码：base64 轻量混淆（内部工具够用；真正的强保护需服务端密钥）
  function encPass(s) { try { return btoa(encodeURIComponent(s)); } catch (e) { return ''; } }
  function decPass(s) { try { return decodeURIComponent(atob(s)); } catch (e) { return ''; } }

  // 主题跟随应用（沿用应用内已保存的 data-bg）
  try {
    var bg = localStorage.getItem('subspacead-bg');
    if (bg) document.documentElement.setAttribute('data-bg', bg);
  } catch (e) {}

  function showErr(m) { err.textContent = m; }
  function resetBtn() { btn.disabled = false; btn.textContent = '登 录'; }

  async function doLogin() {
    var u = user.value.trim(), p = pass.value;
    if (!u || !p) { showErr('请输入用户名和密码'); return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = '登录中…';
    try {
      var r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      var d = await r.json();
      if (!r.ok) { showErr(d.detail || '登录失败'); resetBtn(); return; }
      // 记住账号 / 记住密码：分开保存（密码 base64 混淆），取消则清除对应项
      try {
        if (remUser.checked) localStorage.setItem(REM_USER, u);
        else localStorage.removeItem(REM_USER);
        if (remPass.checked && p) localStorage.setItem(REM_PASS, encPass(p));
        else localStorage.removeItem(REM_PASS);
      } catch (e) {}
      try { localStorage.setItem(TOKEN_KEY, d.token); } catch (e) {}
      window.location.href = '/';   // 登录成功 → 跳转主界面
    } catch (e) {
      showErr('无法连接服务，请稍后重试'); resetBtn();
    }
  }

  btn.addEventListener('click', doLogin);
  pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  user.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

  // 回填记住的账号 / 密码（分别按需）
  try {
    var ru = localStorage.getItem(REM_USER);
    if (ru) { user.value = ru; remUser.checked = true; }
    var rp = localStorage.getItem(REM_PASS);
    if (rp) { pass.value = decPass(rp); remPass.checked = true; }
  } catch (e) {}

  // 已持有有效 token → 直接回主界面（避免重复登录）
  (async function () {
    var t = null;
    try { t = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    if (!t) { user.focus(); return; }
    try {
      var r = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + t } });
      if (r.ok) { window.location.href = '/'; return; }
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    } catch (e) {}
    user.focus();
  })();
})();
</script>
</body>
</html>
